# The backstop. Every gate here already exists as an npm script — the point of
# this file is that they stop depending on someone remembering to run them.
#
# The Claude hook in .claude/settings.json runs check:conventions on every edit,
# but hooks are Claude-only: Codex sessions, other agents, and humans never fire
# them. This job is what actually holds the line for everyone.
name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, hermetic gates. Nothing here needs a network or a packed tarball, so a
  # convention slip or a type error is reported in ~2 minutes rather than after
  # the full suite.
  checks:
    name: checks and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # One patch line above `engines.node` (>=22.12.0), which is the PRODUCT's
          # floor and stays where it is: 22.12 is where unflagged `require(esm)`
          # landed, and nothing shipped needs more. The runner is on 22.13 only
          # because eslint 10 declares `^20.19 || ^22.13 || >=24`. Both versions are
          # the same Node 22 LTS line, so the floor coverage this gives up is
          # theoretical — but if a runtime API ever splits them, this is the reason
          # the gate would not catch it.
          node-version: 22.13.x
          cache: npm
      - run: npm ci
      - name: Conventions
        run: npm run check:conventions
      - name: Feature boundaries
        run: npm run check:boundaries
      - name: Wire contracts
        run: npm run check:wire
      - name: Import cycles
        run: npm run check:cycles
      - name: Contributor docs
        run: npm run check:docs
      - name: Lint
        run: npm run lint
      # Both generators must be checked BEFORE any build: `npm run build`
      # regenerates AGENTS.md and .codex/skills, so a check placed after it can
      # only ever pass.
      - name: AGENTS.md is in sync with CLAUDE.md
        run: node tools/gen-agents-md.mjs --check
      - name: .codex/skills is in sync with .claude/skills
        run: node tools/gen-codex-skills.mjs --check
      - name: Typecheck (build config)
        run: npm run typecheck
      - name: Production build
        run: npm run build

  # ── NO COVERAGE JOB HERE, deliberately ────────────────────────────────────
  #
  # The 100/100/100/100 gate stays LOCAL: `npm run test:coverage`, plus
  # `npm run check:conventions -- --coverage` for the gated-file floor.
  #
  # It was tried here and removed on 2026-07-26 because it cannot pass on a
  # runner, and a permanently red job teaches people to ignore red. All 308 test
  # files DO pass on macos-latest — the shortfall was 99.98%, from exactly two
  # arms that depend on the developer's machine rather than on the code:
  #
  #   agent-binary.ts        `defaultWhich` shells out to `which claude`. A dev
  #                          machine has the agent CLIs installed; a runner does
  #                          not, so the function is never called.
  #   log-enrichment.ts:712  the `catch { continue }` on a malformed
  #                          e2e-summary.json is never taken.
  #
  # Two further preconditions the local gate silently relies on, both found by
  # running here: a built `dist/` must exist (several tests shell out to the real
  # Playwright CLI, which resolves dist/shared/configs/playwright.base.js), and
  # the suite assumes macOS — an ubuntu run failed on `open` vs `xdg-open`,
  # `mkdtemp('/tmpXXXXXX')`, `~/` expansion, and one 5s timeout.
  #
  # To bring it back: inject a failing reader / stub binary resolver so those two
  # arms stop depending on machine state, then restore a job on macos-latest that
  # runs `npm run build` before `npm run test:coverage -- --no-file-parallelism`.
  # --no-file-parallelism is not a tuning knob; the v8 provider intermittently
  # ENOENTs on coverage/.tmp when workers race.

  # Packaging is the only check that proves dist/, bin, templates, prompts and the
  # export map. It packs a tarball, installs it into a scratch project and scaffolds
  # a feature, so it is slow and touches the network — hence its own job.
  pack:
    name: tarball smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the checks job — see the note there on why this is 22.13 and
          # `engines.node` is not.
          node-version: 22.13.x
          cache: npm
      - run: npm ci
      - name: Give git an identity
        run: |
          git config --global user.email ci@canary-lab.invalid
          git config --global user.name "canary-lab ci"
      - run: npm run smoke:pack
